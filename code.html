<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Progress Tracker</title>
  <link rel="shortcut icon" href="fevicon.png" >
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
   body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;                  /* ensures background covers the full page height */
      background-image: url('OIP.jpg');   /* your image file */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;       /* makes it stay while scrolling */ 
    }

    header {
      background: #2196f3;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 1.5rem;
    }
    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }
    

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.25rem;
      margin-bottom: 10px;

    }
    .section-header h1 {
      color: white;
    }
    .progress-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .progress-item {
      background: #CDEBFC;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgb(10, 10, 10);
      transition: transform 0.3s;
    }
    .progress-item:hover {
      transform: translateY(-5px);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .priority {
      font-size: 0.9rem;
      padding: 2px 8px;
      border-radius: 12px;
      color: white;
      background: #ff9800;
    }
    progress {
      width: 100%;
      height: 20px;
      margin-top: 10px;
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #2196f3;
      color: rgb(255, 255, 255);
    }
    .btn:hover { background: #F7A072; }
    .btn-secondary { background: #ff5722; }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(1, 1, 1, 0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #05e6e6;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      max-width: 90%;
    }
  </style>
</head>
<body>
  <header>Professional Progress Tracker</headeR>
  <main>
    <section>
      <div class="section-header">
        <span><h1>Project Progress</h1></span>
        <button class="btn" onclick="openModal('PROJECT')"><H2>Add Project</H2></button>
      </div>
      <div class="progress-container" id="project-progress"></div>
    </section>
    <HR>
    <section>
      <div class="section-header">
        <span><H1>Skill Progress</H1></span>
        <button class="btn" onclick="openModal('SKILL')"><H2>Add Skill</H2></button>
      </div>
      <div class="progress-container" id="skill-progress"></div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal" id="progress-modal">
    <div class="modal-content">
      <h3 id="modal-title"></h3>
      <form id="progressForm">
        <input type="text" id="taskName" placeholder="Task Name" required />
        <input type="number" id="taskProgress" placeholder="Progress %" min="0" max="100" required />
        <textarea id="taskDescription" placeholder="Description"></textarea>
        <input type="date" id="taskDueDate" />
        <select id="taskPriority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
        <div style="margin-top:10px; text-align:right;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
        let projects = JSON.parse(localStorage.getItem('projects')) || [];
        let skills = JSON.parse(localStorage.getItem('skills')) || [];
        let currentType = 'PROJECT';

        function renderProgress(containerId, items) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        items.forEach((item, index) => {
            container.innerHTML += `
            <div class="progress-item">
                <div class="progress-header">
                <h3>${item.name}</h3>
                <span class="priority">${item.priority}</span>
                </div>
                            <progress value="${item.progress}" max="100"></progress>
                <div>${item.progress}% complete</div>
                <div>Due: ${item.dueDate || 'N/A'}</div>
                <div>${item.description || ''}</div>
                <div class="actions">
                <button class="btn" onclick="editTask('${containerId}',${index})">Edit</button>
                <button class="btn btn-secondary" onclick="deleteTask('${containerId}',${index})">Delete</button>
                </div>
            </div>
            `;
        });
        }

        function openModal(type) {
        currentType = type;
        document.getElementById('modal-title').innerText = type === 'PROJECT' ? 'Add Project' : 'Add Skill';
        document.getElementById('progress-modal').style.display = 'flex';
        document.getElementById('progressForm').reset();
        }

        function closeModal() {
        document.getElementById('progress-modal').style.display = 'none';
        }

        document.getElementById('progressForm').onsubmit = function (e) {
        e.preventDefault();
        const task = {
            name: document.getElementById('taskName').value,
            progress: document.getElementById('taskProgress').value,
            description: document.getElementById('taskDescription').value,
            dueDate: document.getElementById('taskDueDate').value,
            priority: document.getElementById('taskPriority').value
        };
        if (currentType === 'PROJECT') {
            projects.push(task);
            localStorage.setItem('projects', JSON.stringify(projects));
            renderProgress('project-progress', projects);
        } else {
            skills.push(task);
            localStorage.setItem('skills', JSON.stringify(skills));
            renderProgress('skill-progress', skills);
        }
        closeModal();
        };

        function editTask(containerId, index) {
        const isProject = containerId === 'project-progress';
        const task = isProject ? projects[index] : skills[index];
        document.getElementById('taskName').value = task.name;
        document.getElementById('taskProgress').value = task.progress;
        document.getElementById('taskDescription').value = task.description;
        document.getElementById('taskDueDate').value = task.dueDate;
        document.getElementById('taskPriority').value = task.priority;
        openModal(isProject ? 'PROJECT' : 'SKILL');

        document.getElementById('progressForm').onsubmit = function(e) {
            e.preventDefault();
            task.name = document.getElementById('taskName').value;
            task.progress = document.getElementById('taskProgress').value;
            task.description = document.getElementById('taskDescription').value;
            task.dueDate = document.getElementById('taskDueDate').value;
            task.priority = document.getElementById('taskPriority').value;
            if (isProject) {
            projects[index] = task;
            localStorage.setItem('projects', JSON.stringify(projects));
            renderProgress('project-progress', projects);
            } else {
            skills[index] = task;
            localStorage.setItem('skills', JSON.stringify(skills));
            renderProgress('skill-progress', skills);
            }
            closeModal();
        }
        }

        function deleteTask(containerId, index) {
        if (confirm('Delete this task?')) {
            if (containerId === 'project-progress') {
            projects.splice(index, 1);
            localStorage.setItem('projects', JSON.stringify(projects));
            renderProgress('project-progress', projects);
            } else {
            skills.splice(index, 1);
            localStorage.setItem('skills', JSON.stringify(skills));
            renderProgress('skill-progress', skills);
            }
        }
        }

        renderProgress('project-progress', projects);
        renderProgress('skill-progress', skills);
    </script>
</body>
</html>
