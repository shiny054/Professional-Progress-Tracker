<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap");

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        display: flex;
        justify-content: center;   /* CENTER HORIZONTALLY */
        align-items: center;       /* CENTER VERTICALLY */
        min-height: 100vh;
        background: url(img.jpg) no-repeat center center/cover;
    }

    .wrapper {
        width: 420px;
        background: rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        border-radius: 10px;
        padding: 30px 40px;
        backdrop-filter: blur(5px);
    }

    .wrapper h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .input-box {
        width: 100%;
        height: 50px;
        margin: 25px 0;
        position: relative;
    }

    .input-box input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        outline: none;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 40px;
        font-size: 16px;
        color: #fff;
        padding: 20px 45px 20px 20px;
    }

    .input-box i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        color: white;
    }

    .wrapper .btn {
        width: 100%;
        height: 45px;
        background: #fff;
        color: #333;
        border: none;
        outline: none;
        border-radius: 40px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14.5px;
    }

    .register-link a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
    }
    </style>
</head>

<body>
    <div class="wrapper">
        <form action="">
            <h1>Register</h1>

            <div class="input-box">
                <input type="tel" placeholder="Mobile Number" required>
                <i class='bx bx-phone'></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Full Name" required>
                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Username" required>
                <i class='bx bx-user-circle'></i>
            </div>

            <button type="submit" class="btn" > <a href="http://127.0.0.1:5500/code.html">Register</button>

            <div class="register-link">
                <p>Have an account? <a href="http://127.0.0.1:5500/login.html">Login</a></p>
            </div>
        </form>
    </div>
</body>
</html>
